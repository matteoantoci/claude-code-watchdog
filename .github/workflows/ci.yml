name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Spec §2: the pinned Claude Code; npm blocks its postinstall script, so run it by hand.
      - run: npm install --no-save --ignore-scripts @anthropic-ai/claude-code@2.1.290
      - run: node node_modules/@anthropic-ai/claude-code/install.cjs
      - run: npx claude --version
      - run: npm run check
